name: Deploy GitHub Pages

on:
  push:
    branches: [main, app]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone repository
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Install and verify
        working-directory: repo
        run: |
          npm ci
          npm run lint
          GITHUB_ACTIONS=true npm run build
          cp dist/index.html dist/404.html
      - name: Publish gh-pages branch
        working-directory: repo/dist
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
      - name: Use gh-pages as Pages source
        run: |
          curl --fail-with-body --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            --data '{"source":{"branch":"gh-pages","path":"/"}}'
